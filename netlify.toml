[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NPM_FLAGS = "--legacy-peer-deps"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_API_URL"

[context.production.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_API_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"
